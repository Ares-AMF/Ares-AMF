name: Actualizar tarjetas del README

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días, 00:17 hora de Chihuahua
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "assets/logo.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar SVGs
        env:
          # Opcional: crea un secreto GH_STATS_TOKEN (PAT con read:user) para contar también tus repos privados
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py
      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: actualizar tarjetas del perfil"
          git push
